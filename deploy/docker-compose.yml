services:
  web-app:
    build:
      context: ..
      dockerfile: ./deploy/docker/django/Dockerfile
    # ports:
    #   - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=dbname
      - DB_USER=dbuser
      - DB_PASS=password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../project:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    networks:
      - onlinedict-react 
    command: python -u manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=dbname
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onlinedict-react
    
  nginx:
    restart: always
    depends_on:
      - web-app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8001:80"
    networks:
      - onlinedict-react

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  onlinedict-react:
    driver: bridge
